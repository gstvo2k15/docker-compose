services:
  websphere-traditional:
    build: .
    container_name: websphere-traditional
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9043:9043"  # ISC (Integrated Solutions Console)
      - "9401:9401"  # SOAP Connector Port
    environment:
      - LICENSE=accept
      - PROFILE_NAME=AppSrv01
    volumes:
      - ./logs:/opt/IBM/WebSphere/AppServer/profiles/AppSrv01/logs
