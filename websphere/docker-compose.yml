services:
  websphere-liberty:
    image: icr.io/appcafe/websphere-liberty:21.0.0.12-full-java11-openj9-ubi-amd64
    container_name: websphere-liberty
    ports:
      - "9080:9080"
      - "9443:9443"
    environment:
      - LICENSE=accept
      - WLP_USER_NAME=admin
      - WLP_USER_PASSWORD=adminpassword
    volumes:
      - ./server:/config
