services:
  # Modo Standalone
  weblogic-standalone:
    image: store/oracle/weblogic:12.2.1.4
    container_name: weblogic-standalone
    ports:
      - "7001:7001"
    environment:
      - DOMAIN_NAME=base_domain
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_PASSWORD=weblogic123
    volumes:
      - ./config:/u01/oracle/user_projects/domains/base_domain/config

  # Modo Domain con múltiples nodos
  weblogic-admin:
    image: store/oracle/weblogic:12.2.1.4
    container_name: weblogic-admin
    ports:
      - "7001:7001"
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_PASSWORD=weblogic123
    volumes:
      - ./config:/u01/oracle/user_projects/domains/domain1/config

  weblogic-managed-1:
    image: store/oracle/weblogic:12.2.1.4
    container_name: weblogic-managed-1
    environment:
      - DOMAIN_NAME=domain1
      - MANAGED_SERVER_NAME=ManagedServer1
      - ADMIN_PORT=7001
      - ADMIN_HOST=weblogic-admin
      - ADMIN_PASSWORD=weblogic123
    depends_on:
      - weblogic-admin

  weblogic-managed-2:
    image: store/oracle/weblogic:12.2.1.4
    container_name: weblogic-managed-2
    environment:
      - DOMAIN_NAME=domain1
      - MANAGED_SERVER_NAME=ManagedServer2
      - ADMIN_PORT=7001
      - ADMIN_HOST=weblogic-admin
      - ADMIN_PASSWORD=weblogic123
    depends_on:
      - weblogic-admin

  # Modo Cluster con balanceo de carga
  nginx-load-balancer:
    image: nginx:latest
    container_name: nginx-weblogic-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weblogic-managed-1
      - weblogic-managed-2

