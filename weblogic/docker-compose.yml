services:
  # Standalone AdminServer
  weblogic-standalone:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-standalone
    ports:
      - "7001:7001"
    environment:
      - DOMAIN_NAME=base_domain
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
      - ADMINISTRATION_PORT_ENABLED=false
      - PRODUCTION_MODE=dev
    volumes:
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Domain Mode AdminServer
  weblogic-admin:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-admin
    ports:
      - "7002:7001"
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
      - ADMINISTRATION_PORT_ENABLED=false
      - PRODUCTION_MODE=dev
      - CLUSTER_NAME=Cluster1
    volumes:
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Managed Server 1
  weblogic-managed-1:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-managed-1
    ports:
      - "8001:7001"
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_HOST=weblogic-admin
      - ADMIN_PORT=7001
      - MANAGED_NAME=ManagedServer1
      - PRODUCTION_MODE=dev
      - CLUSTER_NAME=Cluster1
    depends_on:
      - weblogic-admin
    volumes:
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Managed Server 2
  weblogic-managed-2:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-managed-2
    ports:
      - "8002:7001"
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_HOST=weblogic-admin
      - ADMIN_PORT=7001
      - MANAGED_NAME=ManagedServer2
      - PRODUCTION_MODE=dev
      - CLUSTER_NAME=Cluster1
    depends_on:
      - weblogic-admin
    volumes:
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Standalone Managed Server (Optional, without AdminServer)
  weblogic-standalone-managed:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-standalone-managed
    ports:
      - "9001:7001"
    environment:
      - DOMAIN_NAME=standalone_domain
      - MANAGED_NAME=StandaloneManagedServer
      - PRODUCTION_MODE=dev
    volumes:
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Load Balancer
  nginx-load-balancer:
    image: nginx:latest
    container_name: nginx-weblogic-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weblogic-managed-1
      - weblogic-managed-2
