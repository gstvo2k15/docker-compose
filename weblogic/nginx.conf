worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream cluster_backend {
        server weblogic-managed-1:7001;
        server weblogic-managed-2:7001;
    }

    upstream admin_backend {
        server weblogic-admin:7001;
    }

    upstream standalone_backend {
        server weblogic-standalone:7001;
    }

    server {
        listen 80;

        location /cluster {
            proxy_pass http://cluster_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin {
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /standalone {
            proxy_pass http://standalone_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
